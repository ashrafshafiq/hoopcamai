<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoop Cam AI</title>
<style>
  :root { --orange:#E8722A; --bg:#0e141c; --card:#161e28; --text:#e8edf2; --muted:#9aa7b4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 24px 80px; }
  header { text-align:center; margin-bottom:40px; }
  h1 { font-size:2.4rem; margin:.2em 0; }
  .tag { color:var(--muted); font-size:1.1rem; }
  .badge { display:inline-block; width:84px; height:84px; border-radius:20px;
           background:linear-gradient(135deg,#243447,#0b1118); line-height:84px; font-size:40px; }
  .links { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:32px; }
  a.btn { display:inline-block; padding:14px 22px; border-radius:12px; text-decoration:none;
          background:var(--card); color:var(--text); border:1px solid #243244; font-weight:600; }
  a.btn:hover { border-color:var(--orange); }
  footer { text-align:center; color:var(--muted); margin-top:56px; font-size:.9rem; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">🏀</div>
      <h1>Hoop Cam AI</h1>
      <p class="tag">Your automatic basketball camera operator.</p>
    </header>
    <p style="text-align:center;color:var(--muted)">
      Point your iPhone at the court and Hoop Cam AI detects the ball and players,
      then automatically zooms and tracks the action — all on-device, nothing leaves your phone.
    </p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy</a>
      <a class="btn" href="support.html">Support</a>
    </div>
    <footer>© 2026 Shafiq and Company LLC</footer>
  </div>
</body>
</html>
